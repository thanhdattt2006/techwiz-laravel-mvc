services:
  - type: web
    name: techwiz-laravel-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "TechWiz Laravel App"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:9/HXrPLF/Bn+3Gn1Oa8OBRsK/i8U4hoF2iim9qJVLuQ="
      - key: APP_URL
        value: "https://techwiz-laravel-app.onrender.com"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "mysql-18c62662-thanhdattt2006-laravel-store-database.g.aivencloud.com"
      - key: DB_PORT
        value: "12459"
      - key: DB_DATABASE
        value: "defaultdb"
      - key: DB_USERNAME
        value: "avnadmin"
      - key: DB_PASSWORD
        sync: false # Nhập trực tiếp trên Render Dashboard (Environment Variables) để bảo mật
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
