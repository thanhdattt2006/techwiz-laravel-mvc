<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="avatar-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="avatar-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="avatar-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="64" cy="64" r="62" fill="url(#avatar-bg)" stroke="#BBF7D0" stroke-width="3" />

  <!-- User Silhouette with Shadow -->
  <g filter="url(#avatar-shadow)">
    <!-- Head -->
    <circle cx="64" cy="45" r="21" fill="url(#avatar-user)" />
    <!-- Shoulders / Torso -->
    <path d="M26 104C26 84 43 74 64 74C85 74 102 84 102 104C102 113 96 118 87 118H41C32 118 26 113 26 104Z" fill="url(#avatar-user)" />
  </g>

  <!-- Fresh Botanical Sprout Badge -->
  <g transform="translate(74, 68)">
    <circle cx="16" cy="16" r="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2.5" />
    <path d="M16 23V15" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 16C16 10.5 10.5 9.5 9 9.5C9 15 14 16.5 16 16Z" fill="#16A34A"/>
    <path d="M16 15C16 11.5 20.5 10.5 22.5 10.5C22.5 15 18 16 16 15Z" fill="#4ADE80"/>
  </g>
</svg>
